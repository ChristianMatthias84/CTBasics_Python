[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ctbasics"
version = "0.0.1"
description = "Python port of the CTBasics CT physics framework"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.14",
  "numba>=0.61",
  "matplotlib>=3.9",
  "pydicom>=3.0",
  "psutil>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["CTBasics*"]

[tool.setuptools.package-data]
"CTBasics.Simulation" = ["spectra/*.txt", "attenuationcoeffs/*.txt"]
"CTBasics.RawData" = ["Tables/*/*.IRSTBL", "Tables/*/*.xml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
